   name: Build project

   on:
     push:
       branches: [main]
     workflow_dispatch: {}

   jobs:
     build:
       name: Build for Windows
       runs-on: ubuntu-latest
       steps:
         - name: Free up disk space
           run: |
             sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
             sudo docker image prune --all --force
             df -h /

         - name: Check out the code
           uses: actions/checkout@v4
           with:
             lfs: true

         - name: Cache Unity Library folder
           uses: actions/cache@v4
           with:
             path: Library
             key: Library-Windows-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
             restore-keys: Library-Windows-

         - name: Build with Unity
           uses: game-ci/unity-builder@v4
           env:
             UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
             UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
             UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
           with:
             targetPlatform: StandaloneWindows64

         - name: Save the build
           uses: actions/upload-artifact@v4
           with:
             name: Build-Windows
             path: build